# accounts-proxy configuration (example; the daemon reads ~/.local/share/accounts-proxy/proxy.yaml).
# Default port 4141: measured free and outside every Windows excluded range on 2026-10-06 (P0-E5).
port: 4141
providers:
  claude:
    enabled: true
    # Required. Anthropic restricts subscription OAuth to its own apps; see docs/research §3.
    acknowledgeTermsRisk: true
  antigravity:
    enabled: true
    # Required. Google's Antigravity terms prohibit third-party access; see docs/research §3.
    acknowledgeTermsRisk: true
  openai:
    enabled: true
    # Required. ChatGPT plan usage is documented for open-source, locally hosted apps; see
    # docs/reference/2026-10-11-23-08-openai-chatgpt-plan-rules.md and the specs it cites.
    acknowledgeTermsRisk: true
  # API-key gateways (plan P4.6): no terms acknowledgement; sign in with `accounts-proxy login <provider>`.
  openrouter:
    enabled: true
  opencode:
    enabled: true
  opencode-go:
    enabled: true
  cheaper-inference:
    enabled: true
aliases: {}
# Minutes a fetched model list (and the reference catalog models.opencode.ai) is reused before the next request reads it
# again; default 1440 (24 h). `accounts-proxy models --refresh` reads every list now (plan 2026-10-26 R1, R2).
modelListMaxAgeMinutes: 1440
# Every HTTP exchange (client and upstream, headers, bodies, timings, token usage; credentials redacted) as JSON lines in
# logs/exchanges-YYYY-MM-DD.jsonl; day files older than retentionDays are deleted (plan 2026-10-26 X1-X6).
exchangeLog:
  enabled: true
  retentionDays: 14
